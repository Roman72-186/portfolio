{% extends "base.html" %}
{% block title %}404 — Страница не найдена{% endblock %}
{% block extra_styles %}
<style>
    .page-404 {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 75vh;
        text-align: center;
        padding: 24px;
    }

    .digits {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0;
        line-height: 1;
        margin-bottom: 32px;
    }

    .digit {
        font-size: clamp(96px, 22vw, 180px);
        font-weight: 900;
        color: var(--blue-deep);
        letter-spacing: -4px;
        font-family: inherit;
        user-select: none;
    }

    .digit-zero {
        position: relative;
        width: clamp(90px, 20vw, 170px);
        height: clamp(110px, 25vw, 200px);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border-radius: 50%;
        border: clamp(8px, 2vw, 14px) solid var(--blue-deep);
        box-shadow: 0 0 0 clamp(3px, 0.7vw, 6px) var(--blue-mid),
                    0 8px 40px rgba(30,45,107,0.3);
        background: #000;
        flex-shrink: 0;
    }

    .digit-zero video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        border-radius: 50%;
    }

    .error-title {
        font-size: clamp(18px, 4vw, 26px);
        font-weight: 800;
        color: var(--text);
        margin-bottom: 12px;
        text-shadow: 0 0 20px rgba(255,255,255,0.9), 0 0 8px rgba(255,255,255,0.7);
    }

    .error-desc {
        font-size: clamp(13px, 2.5vw, 16px);
        color: var(--muted);
        line-height: 1.6;
        max-width: 360px;
        margin-bottom: 32px;
        text-shadow: 0 0 20px rgba(255,255,255,0.9), 0 0 8px rgba(255,255,255,0.7);
    }

    .error-actions {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
    }

    .error-cta {
        display: inline-flex;
        justify-content: center;
        min-width: 190px;
    }

    .error-support-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
    }
    .error-support-link:hover {
        color: var(--blue);
    }
</style>
{% endblock %}
{% block content %}
<div class="page-404">
    <div class="digits">
        <span class="digit">4</span>
        <div class="digit-zero">
            <video autoplay loop muted playsinline preload="metadata">
                <source src="/static/404.mp4" type="video/mp4">
            </video>
        </div>
        <span class="digit">4</span>
    </div>

    <h1 class="error-title">Страница не найдена</h1>
    <p class="error-desc">Такой страницы нет — скорее всего, ссылка устарела.</p>

    <div class="error-actions">
        <a href="/" class="btn-blue error-cta">← На главную</a>
        <a href="https://t.me/roman_chatbots" target="_blank" rel="noopener noreferrer" class="error-support-link">
            <svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg> Техподдержка
        </a>
    </div>
</div>
<script>
    document.querySelector('.digit-zero video')?.play().catch(() => {});
</script>
{% endblock %}
