{% extends "base.html" %}
{% block title %}Вход для сотрудников{% endblock %}
{% block extra_styles %}
<style>
.staff-wrap {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 80vh; padding: 24px 16px;
}
.staff-card {
    width: 100%; max-width: 420px;
    background: var(--surface); border-radius: var(--r-xl);
    box-shadow: var(--sh-md); border: 1px solid var(--line);
    padding: 36px 32px;
}
.staff-icon {
    width: 60px; height: 60px; border-radius: var(--r-md);
    background: linear-gradient(135deg, var(--blue-deep), var(--blue-mid));
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px; font-size: 26px;
}
.staff-title {
    font-family: var(--font-display);
    font-size: 22px; font-weight: 700; letter-spacing: -0.03em;
    color: var(--ink); text-align: center; margin-bottom: 6px;
}
.staff-sub {
    font-size: 13px; color: var(--dim); text-align: center;
    margin-bottom: 28px; line-height: 1.5;
}
.staff-field { margin-bottom: 16px; }
.staff-field label {
    display: block; font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.07em;
    color: var(--muted); margin-bottom: 6px;
}
.staff-input {
    width: 100%; padding: 13px 16px;
    border: 1.5px solid var(--line); border-radius: var(--r-md);
    background: var(--surface-2); color: var(--ink);
    font-size: 15px; font-family: inherit;
    transition: border-color 0.2s, box-shadow 0.2s;
    box-sizing: border-box;
}
.staff-input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(59,91,255,.15); }
.staff-btn {
    width: 100%; padding: 15px;
    background: var(--blue);
    color: #fff; border: none; border-radius: var(--r-pill);
    font-size: 15px; font-weight: 700;
    font-family: inherit;
    cursor: pointer; margin-top: 8px;
    box-shadow: var(--sh-blue);
    transition: filter 0.15s, transform 0.15s;
}
.staff-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
.back-link {
    display: block; text-align: center; margin-top: 20px;
    font-size: 13px; color: var(--dim); text-decoration: none;
}
.back-link:hover { color: var(--blue); opacity: 1; }
</style>
{% endblock %}
{% block content %}
<div class="staff-wrap">
    <div class="staff-card">
        <div class="staff-icon"><svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
        <div class="staff-title">Вход для сотрудников</div>
        <div class="staff-sub">Куратор, администратор</div>

        {% if error %}
        <div class="alert alert-error" style="margin-bottom:20px">{{ error }}</div>
        {% endif %}

        <form method="post" action="/login">
            <div class="staff-field">
                <label for="staff-login">Логин</label>
                <input id="staff-login" type="text" name="login" class="staff-input"
                       placeholder="Введите логин" autocomplete="username"
                       autofocus required>
            </div>
            <div class="staff-field">
                <label for="staff-password">Пароль</label>
                <input id="staff-password" type="password" name="password" class="staff-input"
                       placeholder="Введите пароль" autocomplete="current-password"
                       required>
            </div>
            <button type="submit" class="staff-btn">Войти</button>
        </form>

        <a href="/" class="back-link">← Вернуться на главную</a>
    </div>
</div>
{% endblock %}
