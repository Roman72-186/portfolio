{#
Быстрая правка срока приёма работ в списке заданий (владелец 27.09.2026).
Пара к `partials/program_item_deadlines.html`; подключается ВНУТРИ уже
открытого `<script>` страницы, как и `program_blocks_editor_js.html` — своего
тега здесь нет намеренно (вложенные `<script>` браузер не вкладывает).

Один делегированный обработчик на весь список: плашек на странице столько,
сколько блоков сдачи, и вешать по три слушателя на каждую незачем.

Запрос идёт через `window.csrfFetch` — канон с 26.09.2026: ключ берётся
свежим у сервера, а не из разметки, которая могла пролежать открытой сутки.
#}
(function () {
    var list = document.querySelector('[data-deadline-scope]');
    if (!list) return;

    function collect(form) {
        var at = form.querySelector('[data-deadline-at]');
        var rows = [];
        form.querySelectorAll('[data-deadline-tariff]').forEach(function (row) {
            var value = row.querySelector('[data-deadline-tariff-at]');
            var none = row.querySelector('[data-deadline-tariff-none]');
            // Как и в конструкторе: строка уходит, только если у тарифа есть
            // своё правило. Пустая строка без галочки — «как у всех».
            if (none && none.checked) {
                rows.push({tariff: row.getAttribute('data-deadline-tariff'), submit_until: null});
            } else if (value && value.value) {
                rows.push({tariff: row.getAttribute('data-deadline-tariff'), submit_until: value.value});
            }
        });
        return {submit_until: (at && at.value) ? at.value : null, submit_deadlines: rows};
    }

    list.addEventListener('click', function (event) {
        var openBtn = event.target.closest('[data-deadline-edit]');
        if (openBtn) {
            var form = openBtn
                .closest('[data-deadline-endpoint]')
                .querySelector('[data-deadline-form]');
            form.hidden = !form.hidden;
            return;
        }
        var cancelBtn = event.target.closest('[data-deadline-cancel]');
        if (cancelBtn) {
            cancelBtn.closest('[data-deadline-form]').hidden = true;
            return;
        }
        var saveBtn = event.target.closest('[data-deadline-save]');
        if (!saveBtn) return;

        // Адрес приходит с сервера строкой: задание и блок правятся разными
        // роутами, но форма у них одна, и JS про эту разницу не знает.
        var box = saveBtn.closest('[data-deadline-endpoint]');
        var deadlineForm = saveBtn.closest('[data-deadline-form]');
        var message = deadlineForm.querySelector('[data-deadline-message]');
        saveBtn.disabled = true;
        message.textContent = 'Сохраняем…';
        window.csrfFetch(box.getAttribute('data-deadline-endpoint'), {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(collect(deadlineForm))
        }).then(function (resp) {
            return resp.json().catch(function () { return {}; }).then(function (body) {
                if (!resp.ok) throw new Error(window.csrfMessage(body, 'Не удалось сохранить срок.'));
                return body;
            });
        }).then(function () {
            // Перерисовываем страницей, а не руками: подписи сроков по тарифам
            // собирает сервер (`_deadline_rows`), и вторая сборка тех же строк
            // в JS разошлась бы с ней при первой же правке формата.
            window.location.reload();
        }).catch(function (error) {
            saveBtn.disabled = false;
            message.textContent = error.message;
        });
    });
}());
