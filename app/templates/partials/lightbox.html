{% set lightbox_can_rotate = (user is defined and user and user.role_rank is defined and (user.role_rank|int) >= 5) %}
{% if lightbox_can_rotate %}
<style>
.lightbox-tools {
    position: absolute; top: 16px; left: 16px; z-index: 3;
    display: flex; gap: 8px;
}
.lightbox-tool {
    background: rgba(255,255,255,.15); border: none; color: #fff;
    width: 40px; height: 40px; border-radius: 50%; font-size: 20px; line-height: 1;
    cursor: pointer; transition: background 0.2s;
    display: flex; align-items: center; justify-content: center;
}
.lightbox-tool:hover { background: rgba(255,255,255,.28); }
.lightbox-tools.is-busy { opacity: .5; pointer-events: none; }
</style>
{% endif %}
<div id="lightbox" class="lightbox" onclick="closeLightbox(event)">
    <button class="lightbox-close" type="button" onclick="closeLightbox(event)" aria-label="Закрыть">&times;</button>

    <div class="lightbox-stage" onclick="event.stopPropagation()">
        {% if lightbox_can_rotate %}
        <div class="lightbox-tools" id="lightbox-tools">
            <button class="lightbox-tool" type="button" onclick="lightboxRotate('left')" title="Повернуть влево" aria-label="Повернуть влево">⟲</button>
            <button class="lightbox-tool" type="button" onclick="lightboxRotate('right')" title="Повернуть вправо" aria-label="Повернуть вправо">⟳</button>
        </div>
        <script>window.LIGHTBOX_CSRF = "{{ csrf_token(request) }}";</script>
        {% endif %}
        <button class="lightbox-nav lightbox-prev" type="button" onclick="lightboxStep(-1)" aria-label="Предыдущее фото">‹</button>
        <img id="lightbox-img" src="" alt="">
        <button class="lightbox-nav lightbox-next" type="button" onclick="lightboxStep(1)" aria-label="Следующее фото">›</button>

        <div class="lightbox-counter" id="lightbox-counter"></div>

        <div class="lightbox-thumbs" id="lightbox-thumbs" role="tablist" aria-label="Миниатюры"></div>
    </div>
</div>
<script>
(function(){
    var lb = document.getElementById('lightbox');
    var img = document.getElementById('lightbox-img');
    var thumbs = document.getElementById('lightbox-thumbs');
    var counter = document.getElementById('lightbox-counter');
    var slides = [];
    var idx = 0;

    function render() {
        if (!slides.length) return;
        idx = (idx + slides.length) % slides.length;
        var s = slides[idx];
        img.src = s.full;
        img.alt = s.alt || '';
        counter.textContent = (idx + 1) + ' / ' + slides.length;
        var thumbEls = thumbs.querySelectorAll('.lightbox-thumb');
        thumbEls.forEach(function(el, i){
            el.classList.toggle('is-current', i === idx);
            if (i === idx) el.scrollIntoView({block:'nearest', inline:'center', behavior:'smooth'});
        });
        lb.classList.toggle('is-single', slides.length <= 1);
    }

    function setSlides(list, startIdx) {
        slides = list || [];
        idx = Math.max(0, Math.min(startIdx || 0, slides.length - 1));
        thumbs.innerHTML = '';
        slides.forEach(function(s, i){
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'lightbox-thumb';
            btn.setAttribute('role', 'tab');
            btn.setAttribute('aria-label', 'Фото ' + (i + 1));
            btn.onclick = function(){ idx = i; render(); };
            var t = document.createElement('img');
            t.src = s.thumb || s.full;
            t.alt = '';
            t.loading = 'lazy';
            btn.appendChild(t);
            thumbs.appendChild(btn);
        });
        render();
    }

    window.lightboxStep = function(delta){
        if (!slides.length) return;
        idx += delta;
        render();
    };

    // Superadmin: поворот текущего фото на 90° (перезаписывает файл в S3).
    window.lightboxRotate = function(direction){
        if (!slides.length) return;
        var s = slides[idx];
        var base = (s.full || '').split('?')[0];
        if (!base) return;
        var tools = document.getElementById('lightbox-tools');
        if (tools) tools.classList.add('is-busy');
        var fd = new FormData();
        fd.append('src', base);
        fd.append('direction', direction);
        fetch('/cabinet/rotate-photo', {
            method: 'POST',
            headers: {'X-CSRF-Token': window.LIGHTBOX_CSRF || ''},
            body: fd
        }).then(function(r){ return r.json(); }).then(function(d){
            if (tools) tools.classList.remove('is-busy');
            if (!d || !d.success) { alert((d && d.error) || 'Не удалось повернуть фото'); return; }
            var newUrl = d.src;
            // Обновляем все <img> на странице, указывающие на старый объект.
            document.querySelectorAll('img').forEach(function(im){
                if ((im.getAttribute('src') || '').split('?')[0] === base) im.src = newUrl;
                if ((im.getAttribute('data-full') || '').split('?')[0] === base) im.setAttribute('data-full', newUrl);
                if ((im.getAttribute('data-thumb') || '').split('?')[0] === base) im.setAttribute('data-thumb', newUrl);
            });
            // Обновляем слайд и его миниатюру, перерисовываем.
            s.full = newUrl;
            s.thumb = newUrl;
            var thumbImg = thumbs.querySelectorAll('.lightbox-thumb img')[idx];
            if (thumbImg) thumbImg.src = newUrl;
            render();
        }).catch(function(){
            if (tools) tools.classList.remove('is-busy');
            alert('Ошибка сети при повороте фото');
        });
    };

    window.openLightbox = function(src, alt){
        if (!src) return;
        setSlides([{full: src, thumb: src, alt: alt || ''}], 0);
        lb.classList.add('open');
        document.body.style.overflow = 'hidden';
    };

    window.openLightboxGroup = function(list, startIdx){
        if (!list || !list.length) return;
        setSlides(list, startIdx || 0);
        lb.classList.add('open');
        document.body.style.overflow = 'hidden';
    };

    window.openGallery = function(el){
        if (!el) return;
        var root = el.closest('[data-gallery]') || el.parentElement;
        var imgs = Array.from(root.querySelectorAll('img'));
        if (!imgs.length) { window.openLightbox(el.src, el.alt); return; }
        var list = imgs.map(function(i){
            return {
                full: i.dataset.full || i.src,
                thumb: i.dataset.thumb || i.src,
                alt: i.alt || ''
            };
        });
        var start = imgs.indexOf(el);
        window.openLightboxGroup(list, start < 0 ? 0 : start);
    };

    window.closeLightbox = function(e){
        if (e && e.target && e.target.tagName === 'IMG' && e.target.id === 'lightbox-img') return;
        lb.classList.remove('open');
        document.body.style.overflow = '';
    };

    document.addEventListener('keydown', function(e){
        if (!lb.classList.contains('open')) return;
        if (e.key === 'Escape') window.closeLightbox();
        else if (e.key === 'ArrowLeft') window.lightboxStep(-1);
        else if (e.key === 'ArrowRight') window.lightboxStep(1);
    });

    // Swipe navigation on touch
    var touchStartX = null;
    img.addEventListener('touchstart', function(e){
        if (e.touches.length === 1) touchStartX = e.touches[0].clientX;
    }, {passive: true});
    img.addEventListener('touchend', function(e){
        if (touchStartX === null) return;
        var dx = (e.changedTouches[0] || {}).clientX - touchStartX;
        if (Math.abs(dx) > 40) window.lightboxStep(dx < 0 ? 1 : -1);
        touchStartX = null;
    });
})();
</script>
