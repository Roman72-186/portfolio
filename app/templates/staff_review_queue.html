{% extends "base.html" %}
{% block title %}На проверку{% endblock %}
{% block extra_styles %}
<link rel="stylesheet" href="/static/css/program.css?v=10">
{% endblock %}
{% block content %}
{#
Очередь проверки ответов (владелец 31.08.2026). Разметка держится на общих
классах `prg-*` из program.css — своего <style> здесь нет, за этим следит
tests/test_reuse_ratchet.py. Образец формы — staff_homework_submissions.html.
#}
<div class="prg-page">
    <div class="prg-head">
        <div class="prg-head-copy">
            <h1>На проверку</h1>
            <p>
                {% if only == 'all' %}Все ответы учеников, свежие сверху.
                {% else %}Ответы, которые вы ещё не смотрели. Свежие сверху.{% endif %}
            </p>
        </div>
    </div>

    <form class="prg-form" method="get" style="display:block">
        <div class="prg-grid2">
            <label class="prg-field">Показывать
                <select name="only">
                    <option value="new" {{ 'selected' if only != 'all' }}>Непросмотренные</option>
                    <option value="all" {{ 'selected' if only == 'all' }}>Все</option>
                </select>
            </label>
            <label class="prg-field">Предмет
                <select name="subject">
                    <option value="">Любой</option>
                    {% for s in subjects %}
                    <option value="{{ s }}" {{ 'selected' if subject == s }}>{{ s }}</option>
                    {% endfor %}
                </select>
            </label>
            <label class="prg-field">Ученик
                <select name="student">
                    <option value="">Любой</option>
                    {% for s in students %}
                    <option value="{{ s.id }}" {{ 'selected' if student == s.id }}>{{ s.name }}</option>
                    {% endfor %}
                </select>
            </label>
            <label class="prg-field">Тариф
                <select name="tariff">
                    <option value="">Любой</option>
                    {% for t in tariffs %}
                    <option value="{{ t }}" {{ 'selected' if tariff == t }}>{{ t }}</option>
                    {% endfor %}
                </select>
            </label>
        </div>
        {# Фильтра по уровню нет: самой механики уровней в системе пока не
           существует, фильтровать не по чему. Появится — встанет сюда. #}
        <div class="prg-actions">
            <button type="submit" class="btn-blue">Показать</button>
            <a class="btn-outline" href="/cabinet/staff/review">Сбросить</a>
        </div>
    </form>

    {% if items %}
    <div class="prg-items">
        {% for item in items %}
        <div class="prg-item{{ ' is-done' if item.reviewed }}" data-answer="{{ item.answer_id }}">
            <div class="prg-item-copy">
                <div class="prg-meta">
                    <strong>{{ item.student_name }}</strong>
                    <span>{{ item.task_title }}</span>
                    {% if item.subject %}<span>{{ item.subject }}</span>{% endif %}
                </div>
                <p class="prg-hint">{{ item.question }}</p>
                {% if item.chosen %}
                <p><strong>Выбрал:</strong> {{ item.chosen|join(', ') }}</p>
                {% if item.correct %}
                <p class="prg-hint">Верно: {{ item.correct|join(', ') }}</p>
                {% endif %}
                {% endif %}
                {% if item.text %}<p>{{ item.text }}</p>{% endif %}
            </div>
            <div class="prg-item-actions">
                <button type="button" class="btn-outline" data-review-toggle
                        data-reviewed="{{ 'true' if item.reviewed else 'false' }}">
                    {{ 'Вернуть в очередь' if item.reviewed else 'Просмотрено' }}
                </button>
            </div>
        </div>
        {% endfor %}
    </div>
    {% else %}
    <p class="prg-empty">
        {% if only == 'all' %}Ответов пока нет.{% else %}Всё разобрано — новых ответов нет.{% endif %}
    </p>
    {% endif %}
</div>

<script>
(function () {
    var csrfToken = {{ csrf_token(request)|tojson }};
    document.addEventListener('click', function (event) {
        var button = event.target.closest('[data-review-toggle]');
        if (!button) return;
        var row = button.closest('[data-answer]');
        var next = button.getAttribute('data-reviewed') !== 'true';
        button.disabled = true;
        fetch('/cabinet/staff/review/' + row.getAttribute('data-answer'), {
            method: 'POST',
            credentials: 'same-origin',
            headers: {
                'Accept': 'application/json',
                'Content-Type': 'application/json',
                'X-CSRF-Token': csrfToken
            },
            body: JSON.stringify({reviewed: next})
        }).then(function (resp) {
            if (!resp.ok) throw new Error();
            return resp.json();
        }).then(function (data) {
            button.disabled = false;
            button.setAttribute('data-reviewed', data.reviewed ? 'true' : 'false');
            button.textContent = data.reviewed ? 'Вернуть в очередь' : 'Просмотрено';
            row.classList.toggle('is-done', data.reviewed);
        }).catch(function () {
            button.disabled = false;
            button.textContent = 'Не вышло, ещё раз';
        });
    });
})();
</script>

{% set active_tab = "review" %}
{% include "partials/bottom_nav.html" %}
{% endblock %}
