{% extends "base.html" %}
{#
Единый экран проверки (созвон 01.09.2026): список учеников с непроверенным
наверху, вместо очереди «по типу задания через весь список». Без своего
<style> — только prg-* (program.css), образец — staff_review_queue.html.
#}
{% block title %}Проверка по ученику{% endblock %}
{% block extra_styles %}
<link rel="stylesheet" href="/static/css/program.css?v=55">
{% endblock %}
{% block content %}
<div class="prg-page">
    <div class="prg-head">
        <div class="prg-head-copy">
            <h1>Проверка по ученику</h1>
            <p>Откройте ученика — увидите всё, что он сдал, в одном месте.</p>
            {% if is_filtered %}<p>Найдено {{ rows|length }} из {{ total }}</p>{% endif %}
        </div>
    </div>

    {#
    Поиск и фильтры (владелец 28.09.2026) — GET-форма на тех же prg-form/
    prg-field, что у фильтра недели на карточке ученика. Фильтруют на сервере
    (`review_aggregate.filter_review_rows`): список собирается за один запрос,
    а фильтр только сужает его. Куратор выбирается лишь с ГП и выше.
    #}
    {% macro search_field() %}
    <label class="prg-field">Поиск
        <input type="search" name="q" value="{{ filters.q }}"
               placeholder="{{ 'Имя или @username' if full_access else 'Имя ученика' }}"
               autocomplete="off">
    </label>
    {% endmacro %}
    {% macro status_field() %}
    <label class="prg-field">Проверка
        <select name="status">
            <option value="">Все</option>
            <option value="{{ status_unchecked }}" {{ 'selected' if filters.status == status_unchecked }}>Есть непроверенное</option>
            <option value="{{ status_checked }}" {{ 'selected' if filters.status == status_checked }}>Всё проверено</option>
        </select>
    </label>
    {% endmacro %}
    {% macro tariff_field() %}
    <label class="prg-field">Тариф
        <select name="tariff">
            <option value="">Любой</option>
            {% for t in tariffs %}
            <option value="{{ t }}" {{ 'selected' if filters.tariff == t }}>{{ t|tariff_label }}</option>
            {% endfor %}
            <option value="{{ newcomer_tariff }}" {{ 'selected' if filters.tariff == newcomer_tariff }}>Новенький (без тарифа)</option>
        </select>
    </label>
    {% endmacro %}
    <form class="prg-form" method="get" role="search" aria-label="Поиск ученика">
        {% if full_access %}
        <div class="prg-grid2">{{ search_field() }}{{ status_field() }}</div>
        <div class="prg-grid2">
            {{ tariff_field() }}
            <label class="prg-field">Куратор
                <select name="curator">
                    <option value="">Любой</option>
                    {% for c in curators %}
                    <option value="{{ c.id }}" {{ 'selected' if filters.curator == c.id|string }}>{{ c.name }}</option>
                    {% endfor %}
                    <option value="{{ no_curator }}" {{ 'selected' if filters.curator == no_curator }}>Без куратора</option>
                </select>
            </label>
        </div>
        {% else %}
        <div class="prg-grid3">{{ search_field() }}{{ status_field() }}{{ tariff_field() }}</div>
        {% endif %}
        <div class="prg-actions">
            <button type="submit" class="btn-blue">Найти</button>
            {% if is_filtered %}<a class="btn-outline" href="/cabinet/staff/students-review">Сбросить</a>{% endif %}
        </div>
    </form>

    <section class="prg-items">
        {% if rows %}
        {% for row in rows %}
        <a class="prg-item" href="/cabinet/staff/students-review/{{ row.student.id }}">
            <div>
                <h3>{{ row.student.name }}</h3>
                <div class="prg-meta">
                    {% if row.student.tariff %}<span>{{ row.student.tariff }}</span>{% endif %}
                </div>
            </div>
            <div class="prg-item-actions">
                {% if row.unchecked > 0 %}
                <span class="prg-badge">{{ row.unchecked }} непроверено</span>
                {% else %}
                <span class="prg-badge">всё проверено</span>
                {% endif %}
            </div>
        </a>
        {% endfor %}
        {% elif is_filtered and total %}
        <div class="prg-empty">По этим условиям никого нет. Попробуйте убрать часть фильтров.</div>
        {% else %}
        <div class="prg-empty">Учеников пока нет.</div>
        {% endif %}
    </section>
</div>
{% include "_curator_nav.html" %}
{% endblock %}
