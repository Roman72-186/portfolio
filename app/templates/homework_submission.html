{% extends "base.html" %}
{#
Общий шаблон для ученика (/cabinet/homework/{task_id}) и куратора
(/cabinet/staff/homework/submissions/{submission_id}) — viewer_role разводит
разметку, как в cabinet_feedback_detail.html. Свой блок <style> не заводим —
только prg-* (program.css) и глобальные классы base.css (card/field-input/
photo-grid/chip/empty-state): новый <style> в шаблоне запрещает
tests/test_reuse_ratchet.py. iOS-ре-скин (25.08.2026) — в отдельном файле
app/static/css/homework_ios.css, переопределяющем эти общие классы под
скоупом .ios-homework; program.css не редактировался, ?v= не поднимался.
#}
{% block title %}{{ homework.title }}{% endblock %}
{% block extra_styles %}
<link rel="stylesheet" href="/static/css/program.css?v=21">
<link rel="stylesheet" href="/static/css/homework_ios.css?v=5">
{% endblock %}
{% block content %}
<div class="ios-homework prg-page">
    <a class="back-link" href="{{ back_url }}">← Назад</a>
    <div class="prg-head">
        <div class="prg-head-copy">
            <h1>{{ homework.title }}</h1>
            {% if viewer_role != 'student' and student %}
            <p>Ученик: <strong>{{ student.name }}</strong></p>
            {% endif %}
        </div>
    </div>

    <div class="card hw-card">
        <div class="card-title">Задание</div>
        {% if homework.description %}<p class="card-desc">{{ homework.description }}</p>{% endif %}
        {% if reference_images %}
        <div class="photo-grid" data-gallery="hw-ref-{{ task.id }}">
            {% for img in reference_images %}
            <button type="button" class="photo-zoom-button" onclick="openGallery(this.firstElementChild)" aria-label="Открыть фото">
                <img src="{{ img.image_s3_url }}" alt="Референс задания" loading="lazy">
            </button>
            {% endfor %}
        </div>
        {% endif %}
    </div>

    <div class="card hw-card">
        <div class="card-title">Ваша работа</div>
        {% if final_image or intermediate_images %}
        <div data-gallery="hw-work-{{ submission.id }}">
        {% endif %}
        {% if final_image %}
        <div class="photo-grid hw-final-photo">
            <button type="button" class="photo-zoom-button" onclick="openGallery(this.firstElementChild)" aria-label="Открыть финальное фото">
                <img src="{{ final_image.image_s3_url }}" alt="Финальное фото">
            </button>
        </div>
        {% else %}
        <p class="card-desc">Финальное фото ещё не загружено.</p>
        {% endif %}

        {% if viewer_role == 'student' %}
        <form class="hw-async-form hw-form" method="post" action="/cabinet/homework/{{ task.id }}/final" enctype="multipart/form-data">
            <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
            <label class="form-label">{{ 'Пересдать финальное фото' if final_image else 'Загрузить финальное фото' }}</label>
            <input type="file" class="field-input" name="photo" accept="image/*" required>
            <button type="submit" class="btn-blue hw-submit">Отправить</button>
            <p class="prg-message"></p>
        </form>
        {% endif %}

        {% if intermediate_images %}
        <div class="section-label hw-section-label">Промежуточные фото</div>
        <div class="photo-grid">
            {% for img in intermediate_images %}
            <button type="button" class="photo-zoom-button" onclick="openGallery(this.firstElementChild)" aria-label="Открыть промежуточное фото">
                <img src="{{ img.image_s3_url }}" alt="Промежуточное фото" loading="lazy">
            </button>
            {% endfor %}
        </div>
        {% endif %}
        {% if final_image or intermediate_images %}
        </div>
        {% endif %}

        {% if viewer_role == 'student' %}
        <form class="hw-async-form hw-form" method="post" action="/cabinet/homework/{{ task.id }}/intermediate" enctype="multipart/form-data">
            <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
            <label class="form-label">Добавить промежуточные фото (до {{ max_intermediate }})</label>
            <input type="file" class="field-input" name="photos" accept="image/*" multiple required>
            <button type="submit" class="btn-outline hw-submit">Добавить</button>
            <p class="prg-message"></p>
        </form>
        {% endif %}
    </div>

    <div class="card">
        <div class="card-title">Обратная связь{% if unread_feedback %} <span class="chip hw-accepted">Новое</span>{% endif %}</div>
        {% if message_count %}
        <p class="card-desc">Сообщений: {{ message_count }}.</p>
        {% else %}
        <p class="card-desc">
            {% if viewer_role == 'student' %}Куратор ещё не оставил обратную связь.
            {% else %}Сообщений пока нет — напишите первым.{% endif %}
        </p>
        {% endif %}
        {% if viewer_role != 'student' and final_image and submission.status != 'accepted' %}
        <form class="hw-async-form hw-form" method="post" action="/cabinet/staff/homework/submissions/{{ submission.id }}/accept">
            <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
            <button type="submit" class="btn-blue">Принять работу</button>
            <p class="prg-message"></p>
        </form>
        {% elif viewer_role != 'student' and submission.status == 'accepted' %}
        <span class="chip hw-accepted">Работа принята</span>
        {% endif %}
        <a class="btn-outline hw-submit" href="{{ feedback_url }}">Открыть обратную связь</a>
    </div>
</div>

{% include "partials/lightbox.html" %}

<script>
(function () {
    document.querySelectorAll('.hw-async-form').forEach(function (form) {
        form.addEventListener('submit', function (event) {
            event.preventDefault();
            var msg = form.querySelector('.prg-message');
            var btn = form.querySelector('button[type=submit]');
            var csrf = form.querySelector('[name=csrf_token]').value;
            btn.disabled = true;
            fetch(form.action, {
                method: 'POST',
                credentials: 'same-origin',
                headers: {'X-CSRF-Token': csrf},
                body: new FormData(form),
            }).then(function (response) {
                return response.json().catch(function () { return {}; }).then(function (data) {
                    if (!response.ok || data.ok === false) {
                        throw new Error(data.error || 'Не получилось отправить, попробуйте ещё раз.');
                    }
                    return data;
                });
            }).then(function () {
                window.location.reload();
            }).catch(function (error) {
                btn.disabled = false;
                if (msg) { msg.textContent = error.message; msg.classList.add('is-error'); }
            });
        });
    });
})();
</script>

{% if viewer_role == 'student' %}
{% set active_tab = "learning" %}
{% include "partials/bottom_nav.html" %}
{% endif %}
{% endblock %}
