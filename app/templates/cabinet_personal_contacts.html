{% extends "base.html" %}
{#
Самостоятельная правка личных данных ученика
(`/cabinet/personal/contacts`). Тариф и начало обучения показаны рядом только
для просмотра: эти поля определяют доступ и учебный прогресс.

Своего блока <style> здесь нет: экран говорит теми же `.prs-*` классами, что и
`cabinet_personal.html`, стили формы дописаны в app/static/css/personal_ios.css.
#}
{% block title %}Личные данные{% endblock %}
{% block extra_styles %}
<link rel="stylesheet" href="/static/css/account_actions.css?v=2">
<link rel="stylesheet" href="/static/css/personal_ios.css?v=18">
{% endblock %}
{% block content %}
<div class="prs-page ios-personal">

    <div class="prs-hero">
        <h1>Личные данные</h1>
        <p>Здесь можно изменить данные профиля и контакты.</p>
    </div>

    {% if errors %}
    <div class="alert alert-error prs-alert">
        {% for e in errors %}<div>{{ e }}</div>{% endfor %}
    </div>
    {% endif %}

    <form method="post" action="/cabinet/personal/contacts" class="prs-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">

        {#
        Порядок полей и разбивка на секции повторяют анкету (`profile.html`),
        вплоть до последовательности внутри «Контактов». Ученик заполняет анкету
        один раз, а правит эти же данные здесь — до 28.09.2026 он находил поля
        переставленными: контакты шли в другом порядке, имя родителя
        жило в отдельной секции, а год поступления стоял в «О тебе», тогда как
        в анкете он в «Учёбе». Меняешь порядок в одном файле — меняй и во втором.

        Каникулярный набор (`holiday_form`, 15.10.2026, поля школы 16.10.2026)
        правит здесь только поля своей короткой анкеты: имя, фамилия, телефон,
        ник Telegram, «Где учишься?» — сервер принимает только их
        (`cabinet_personal._save_holiday_contacts`).
        #}
        <div class="prs-section-title">О тебе</div>
        <div class="prs-group">
            <div class="prs-field">
                <label class="prs-field-label" for="contacts-first-name">Имя <span class="prs-required">*</span></label>
                <input class="prs-field-input" type="text" id="contacts-first-name" name="first_name" required
                       value="{{ form.first_name }}" maxlength="50" autocomplete="given-name">
            </div>
            <div class="prs-field">
                <label class="prs-field-label" for="contacts-last-name">Фамилия <span class="prs-required">*</span></label>
                <input class="prs-field-input" type="text" id="contacts-last-name" name="last_name" required
                       value="{{ form.last_name }}" maxlength="50" autocomplete="family-name">
            </div>
            {% if not holiday_form %}
            <div class="prs-field">
                <label class="prs-field-label" for="contacts-birth-date">Дата рождения <span class="prs-required">*</span></label>
                <input class="prs-field-input" type="date" id="contacts-birth-date" name="birth_date" required
                       min="{{ birth_date_min }}" max="{{ birth_date_max }}" value="{{ form.birth_date }}"
                       autocomplete="bday">
            </div>
            <div class="prs-field">
                <label class="prs-field-label" for="contacts-city">Город <span class="prs-required">*</span></label>
                <input class="prs-field-input" type="text" id="contacts-city" name="city" required
                       value="{{ form.city }}" maxlength="100" autocomplete="address-level2">
            </div>
            <div class="prs-field">
                <label class="prs-field-label" for="contacts-timezone">Часовой пояс <span class="prs-required">*</span></label>
                <select class="prs-field-input" id="contacts-timezone" name="timezone" required>
                    <option value="" disabled {% if not form.timezone %}selected{% endif %}>Выбери часовой пояс</option>
                    {% for tz_value, tz_label in timezones %}
                    <option value="{{ tz_value }}" {% if form.timezone == tz_value %}selected{% endif %}>{{ tz_label }}</option>
                    {% endfor %}
                </select>
            </div>
            {% endif %}
        </div>

        <div class="prs-section-title">Контакты</div>
        <div class="prs-group">
            <div class="prs-field">
                <label class="prs-field-label" for="contacts-phone">Телефон <span class="prs-required">*</span></label>
                <input class="prs-field-input" type="tel" id="contacts-phone" name="phone" required
                       value="{{ form.phone }}" placeholder="+7 999 123-45-67" data-phone-mask
                       autocomplete="tel" inputmode="tel" maxlength="32"
                       pattern="[\d\s\+\.\-\(\)]{8,32}"
                       aria-describedby="contacts-phone-hint">
                <p class="prs-field-note" id="contacts-phone-hint">Для номера другой страны укажи код, например +375.</p>
            </div>
            {% if holiday_form %}
            <div class="prs-field">
                <label class="prs-field-label" for="contacts-tg">Ник в Telegram <span class="prs-required">*</span></label>
                <input class="prs-field-input" type="text" id="contacts-tg" name="tg_username" readonly
                       value="{{ ('@' ~ user.tg_username) if user.tg_username else '' }}"
                       placeholder="ника нет" aria-describedby="contacts-tg-hint">
                <p class="prs-field-note" id="contacts-tg-hint">Берём из Telegram, здесь он не меняется. Нет ника – задай его в настройках Telegram, поле «Имя пользователя», затем выйди и войди снова.</p>
            </div>
            {% else %}
            <div class="prs-field">
                <label class="prs-field-label" for="contacts-parent-phone">Телефон родителя <span class="prs-required">*</span></label>
                <input class="prs-field-input" type="tel" id="contacts-parent-phone" name="parent_phone" required
                       value="{{ form.parent_phone }}" placeholder="+7 999 123-45-67" data-phone-mask
                       autocomplete="tel" inputmode="tel" maxlength="32"
                       pattern="[\d\s\+\.\-\(\)]{8,32}">
            </div>
            <div class="prs-field">
                <label class="prs-field-label" for="contacts-tg">Ник в Telegram <span class="prs-required">*</span></label>
                <input class="prs-field-input" type="text" id="contacts-tg" name="tg_username" required
                       value="{{ form.tg_username }}" placeholder="@username"
                       maxlength="32" pattern="@?[A-Za-z0-9_]{4,31}">
                <p class="prs-field-note">По этому нику твои работы находятся в облаке. Меняешь ник – напиши в поддержку, иначе загруженное раньше потеряется.</p>
            </div>
            <div class="prs-field">
                <label class="prs-field-label" for="contacts-email">Электронная почта <span class="prs-required">*</span></label>
                <input class="prs-field-input" type="email" id="contacts-email" name="email" required
                       value="{{ form.email }}" placeholder="mail@example.com" maxlength="200">
            </div>
            <div class="prs-field">
                <label class="prs-field-label" for="contacts-parent-name">Имя и отчество родителя <span class="prs-required">*</span></label>
                <input class="prs-field-input" type="text" id="contacts-parent-name" name="parent_name" required
                       value="{{ form.parent_name }}" placeholder="Имя Отчество" maxlength="150">
            </div>
            <div class="prs-field">
                <label class="prs-field-label" for="contacts-sdek">Ближайший адрес СДЭК <span class="prs-required">*</span></label>
                <input class="prs-field-input" type="text" id="contacts-sdek" name="sdek_address" required
                       value="{{ form.sdek_address }}" placeholder="Город, улица, номер дома, корпус и т. д." maxlength="300">
            </div>
            {% endif %}
        </div>

        {% if holiday_form %}
        <div class="prs-section-title">Учёба</div>
        <div class="prs-group">
            <div class="prs-field">
                <label class="prs-field-label" for="contacts-school-grade">Где учишься? <span class="prs-required">*</span></label>
                <select class="prs-field-input" id="contacts-school-grade" name="school_grade" required>
                    <option value="" disabled {% if not form.school_grade %}selected{% endif %}>Выбери вариант</option>
                    {% for g, g_label in school_grades %}
                    <option value="{{ g }}" {% if form.school_grade == g %}selected{% endif %}>{{ g_label }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        {% else %}
        <div class="prs-section-title">Обучение</div>
        <div class="prs-group">
            <div class="prs-field">
                <label class="prs-field-label" for="contacts-university-year">Год поступления в вуз <span class="prs-required">*</span></label>
                <select class="prs-field-input" id="contacts-university-year" name="university_year" required>
                    <option value="" disabled {% if not form.university_year %}selected{% endif %}>Выбери год</option>
                    {% for year in university_years %}
                    <option value="{{ year }}" {% if form.university_year|int == year %}selected{% endif %}>{{ year }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="prs-row">
                <span class="prs-row-label">Тариф</span>
                <span class="prs-row-value {{ '' if locked.tariff else 'empty' }}">{{ locked.tariff or 'Не указано' }}</span>
            </div>
            <div class="prs-row">
                <span class="prs-row-label">Начало обучения</span>
                <span class="prs-row-value {{ '' if locked.enrollment_year else 'empty' }}">
                    {%- if locked.enrollment_year -%}
                        {{ locked.enrollment_month ~ ' ' if locked.enrollment_month }}{{ locked.enrollment_year }}
                    {%- else -%}Не указано{%- endif -%}
                </span>
            </div>
        </div>
        <p class="prs-note">Тариф и дата начала обучения зависят от оплаты и учебной программы. Если здесь ошибка, напиши в поддержку.</p>
        {% endif %}

        <div class="prs-form-actions">
            <button type="submit" class="prs-save-btn">Сохранить</button>
            <a class="prs-cancel-link" href="/cabinet/personal">Отмена</a>
        </div>
    </form>

    <div class="prs-bottom-gap"></div>
</div>
<script src="/static/js/phone-mask.js?v=2"></script>

{% set active_tab = "personal" %}
{% include "partials/bottom_nav.html" %}
{% endblock %}
