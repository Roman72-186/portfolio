{% extends "base.html" %}
{#
Самостоятельная правка личных данных ученика
(`/cabinet/personal/contacts`). Тариф и начало обучения показаны рядом только
для просмотра: эти поля определяют доступ и учебный прогресс.

Своего блока <style> здесь нет: экран говорит теми же `.prs-*` классами, что и
`cabinet_personal.html`, стили формы дописаны в app/static/css/personal_ios.css.
#}
{% block title %}Личные данные{% endblock %}
{% block extra_styles %}
<link rel="stylesheet" href="/static/css/account_actions.css?v=1">
<link rel="stylesheet" href="/static/css/personal_ios.css?v=8">
{% endblock %}
{% block content %}
<div class="prs-page ios-personal">

    <div class="prs-hero">
        <h1>Личные данные</h1>
        <p>Здесь можно изменить данные профиля и контакты.</p>
    </div>

    {% if errors %}
    <div class="alert alert-error prs-alert">
        {% for e in errors %}<div>{{ e }}</div>{% endfor %}
    </div>
    {% endif %}

    <form method="post" action="/cabinet/personal/contacts" class="prs-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">

        <div class="prs-section-title">О тебе</div>
        <div class="prs-group">
            <div class="prs-field">
                <label class="prs-field-label" for="contacts-first-name">Имя</label>
                <input class="prs-field-input" type="text" id="contacts-first-name" name="first_name" required
                       value="{{ form.first_name }}" placeholder="Имя" maxlength="50" autocomplete="given-name">
            </div>
            <div class="prs-field">
                <label class="prs-field-label" for="contacts-last-name">Фамилия</label>
                <input class="prs-field-input" type="text" id="contacts-last-name" name="last_name" required
                       value="{{ form.last_name }}" placeholder="Фамилия" maxlength="50" autocomplete="family-name">
            </div>
            <div class="prs-field">
                <label class="prs-field-label" for="contacts-birth-date">Дата рождения</label>
                <input class="prs-field-input" type="date" id="contacts-birth-date" name="birth_date" required
                       min="{{ birth_date_min }}" max="{{ birth_date_max }}" value="{{ form.birth_date }}"
                       autocomplete="bday">
            </div>
            <div class="prs-field">
                <label class="prs-field-label" for="contacts-city">Город</label>
                <input class="prs-field-input" type="text" id="contacts-city" name="city" required
                       value="{{ form.city }}" placeholder="Город" maxlength="100" autocomplete="address-level2">
            </div>
            <div class="prs-field">
                <label class="prs-field-label" for="contacts-timezone">Часовой пояс</label>
                <select class="prs-field-input" id="contacts-timezone" name="timezone" required>
                    <option value="" disabled {% if not form.timezone %}selected{% endif %}>Выбери часовой пояс</option>
                    {% for tz_value, tz_label in timezones %}
                    <option value="{{ tz_value }}" {% if form.timezone == tz_value %}selected{% endif %}>{{ tz_label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="prs-field">
                <label class="prs-field-label" for="contacts-university-year">Год поступления в вуз</label>
                <select class="prs-field-input" id="contacts-university-year" name="university_year" required>
                    <option value="" disabled {% if not form.university_year %}selected{% endif %}>Выбери год</option>
                    {% for year in university_years %}
                    <option value="{{ year }}" {% if form.university_year|int == year %}selected{% endif %}>{{ year }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="prs-section-title">Контакты</div>
        <div class="prs-group">
            <div class="prs-field">
                <label class="prs-field-label" for="contacts-phone">Телефон</label>
                <input class="prs-field-input" type="tel" id="contacts-phone" name="phone" required
                       value="{{ form.phone }}" placeholder="+7 999 123-45-67" data-phone-mask
                       autocomplete="tel" inputmode="tel" maxlength="32"
                       pattern="[\d\s\+\.\-\(\)]{8,32}"
                       aria-describedby="contacts-phone-hint">
                <p class="prs-field-note" id="contacts-phone-hint">Для номера другой страны укажи код, например +375.</p>
            </div>
            <div class="prs-field">
                <label class="prs-field-label" for="contacts-parent-phone">Телефон родителя</label>
                <input class="prs-field-input" type="tel" id="contacts-parent-phone" name="parent_phone" required
                       value="{{ form.parent_phone }}" placeholder="+7 999 123-45-67" data-phone-mask
                       autocomplete="tel" inputmode="tel" maxlength="32"
                       pattern="[\d\s\+\.\-\(\)]{8,32}">
            </div>
            <div class="prs-field">
                <label class="prs-field-label" for="contacts-tg">Ник в Telegram</label>
                <input class="prs-field-input" type="text" id="contacts-tg" name="tg_username" required
                       value="{{ form.tg_username }}" placeholder="@username"
                       maxlength="32" pattern="@?[A-Za-z0-9_]{4,31}">
                <p class="prs-field-note">По этому нику твои работы находятся в облаке. Меняешь ник – напиши в поддержку, иначе загруженное раньше потеряется.</p>
            </div>
            <div class="prs-field">
                <label class="prs-field-label" for="contacts-email">Электронная почта</label>
                <input class="prs-field-input" type="email" id="contacts-email" name="email" required
                       value="{{ form.email }}" placeholder="mail@example.com" maxlength="200">
            </div>
            <div class="prs-field">
                <label class="prs-field-label" for="contacts-vk">Ссылка на ВКонтакте</label>
                <input class="prs-field-input" type="text" id="contacts-vk" name="vk_profile_url" required
                       value="{{ form.vk_profile_url }}" placeholder="vk.com/имя" maxlength="200">
            </div>
            <div class="prs-field">
                <label class="prs-field-label" for="contacts-sdek">Ближайший адрес СДЭК</label>
                <input class="prs-field-input" type="text" id="contacts-sdek" name="sdek_address" required
                       value="{{ form.sdek_address }}" placeholder="Город, улица, номер дома, корпус и т. д." maxlength="300">
            </div>
        </div>

        <div class="prs-section-title">Данные родителя</div>
        <div class="prs-group">
            <div class="prs-field">
                <label class="prs-field-label" for="contacts-parent-name">Имя и отчество родителя</label>
                <input class="prs-field-input" type="text" id="contacts-parent-name" name="parent_name" required
                       value="{{ form.parent_name }}" placeholder="Имя Отчество" maxlength="150">
            </div>
        </div>

        <div class="prs-section-title">Обучение</div>
        <div class="prs-group">
            <div class="prs-row">
                <span class="prs-row-label">Тариф</span>
                <span class="prs-row-value {{ '' if locked.tariff else 'empty' }}">{{ locked.tariff or 'Не указано' }}</span>
            </div>
            <div class="prs-row">
                <span class="prs-row-label">Начало обучения</span>
                <span class="prs-row-value {{ '' if locked.enrollment_year else 'empty' }}">
                    {%- if locked.enrollment_year -%}
                        {{ locked.enrollment_month ~ ' ' if locked.enrollment_month }}{{ locked.enrollment_year }}
                    {%- else -%}Не указано{%- endif -%}
                </span>
            </div>
        </div>
        <p class="prs-note">Тариф и дата начала обучения зависят от оплаты и учебной программы. Если здесь ошибка, напиши в поддержку.</p>

        <div class="prs-form-actions">
            <button type="submit" class="prs-save-btn">Сохранить</button>
            <a class="prs-cancel-link" href="/cabinet/personal">Отмена</a>
        </div>
    </form>

    <div class="prs-bottom-gap"></div>
</div>
<script src="/static/js/phone-mask.js?v=2"></script>

{% set active_tab = "personal" %}
{% include "partials/bottom_nav.html" %}
{% endblock %}
