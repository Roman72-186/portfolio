{% extends "base.html" %}
{% block title %}Оплаты{% endblock %}
{% block extra_styles %}
<link rel="stylesheet" href="/static/css/program.css?v=76">
<link rel="stylesheet" href="/static/css/superadmin_forms_ios.css?v=13">
{% endblock %}
{% block content %}
{#
Экран «Оплаты» (план оплаты, шаг 3): кто оплатил за месяц, кто нет.
Считает `services/payment_board.py`. Своего <style> нет: полоса месяца,
таблица, метки и форма — классы `program.css`, как у статистики цикла.
Смотреть и скачивать Excel — `payments_viewer` (суперадмин и ГП). Кнопки —
у `payments_staff` с действием `people:students`; сервер проверяет то же.
Статистика оплат — `plans/2026-10-13-payment-stats.md`.
С 14.10.2026 экран открывается из «Статистики активности» (карточка «Оплаты»),
а не вкладкой «Пользователей»; фильтр «Оплатили / Не оплатили» и поиск по
имени, нику и номеру сужают только таблицу — итоги месяца считаются по всем.
#}
{% set can_mark = payments_staff(user) %}
{% if not holiday %}
{% set filter_qs = ('&status=' ~ (filters.status|urlencode) if filters.status else '') ~ ('&q=' ~ (filters.q|urlencode) if filters.q else '') %}
{% set is_filtered = filters.status or filters.q %}
{% endif %}
<div class="prg-page">
    <div class="prg-head">
        <div>
            <a class="back-link" href="/cabinet/superadmin/activity{% if holiday %}?program=holiday{% endif %}#activity-payments">← К статистике</a>
            <h1>Оплаты</h1>
        </div>
        {# «Оплата списком» и отсюда: вкладка живёт в «Людях», а Александрии
           (поимённый доступ к оплатам, 14.10.2026) раздел «Люди» закрыт —
           без этой ссылки до загрузки ей не дойти (26.10.2026). #}
        <div class="prg-actions">
            {% if can_mark and can(user, "people:students") %}
            <a class="btn-blue" href="/cabinet/superadmin/payment-import">Оплата списком</a>
            {% endif %}
        </div>
    </div>
    {# Годовой курс / Каникулярный курс (владелец 19.10.2026) —
       `report_scope.report_program_switch`, общий партиал переключателя. #}
    {% include "partials/program_switch.html" %}

    {% if holiday %}
    <section class="prg-workspace-header" data-holiday-payments aria-label="Фильтры оплат">
        <div class="prg-meta">
            <span>Оплатили: {{ holiday.paid_count }}{% if holiday.paid_total %} на {{ holiday.paid_total }}{% endif %}</span>
            <span>Вошли в набор: {{ holiday.students_total }}</span>
            <span>Без трека: {{ holiday.without_track|length }}</span>
        </div>
        <nav class="seg" aria-label="Оплаты треков">
            {% for value, label in holiday_labels.items() %}
            <a class="seg-btn{% if holiday_status == value %} active{% endif %}"
               href="/cabinet/superadmin/payments?program=holiday{% if value %}&amp;status={{ value }}{% endif %}{% if holiday_q and value != 'tracks' %}&amp;q={{ holiday_q|urlencode }}{% endif %}"
               {% if holiday_status == value %}aria-current="page"{% endif %}>{{ label }} · {{ holiday_counts[value] }}</a>
            {% endfor %}
        </nav>
        {% if holiday_status != 'tracks' %}
        <form class="prg-workspace-row" method="get" action="/cabinet/superadmin/payments" role="search" aria-label="Поиск ученика в оплатах">
            <input type="hidden" name="program" value="holiday">
            <input type="hidden" name="status" value="{{ holiday_status }}">
            <label class="prg-field prg-workspace-heading">Поиск
                <input type="search" name="q" value="{{ holiday_q }}" placeholder="Имя, ник в Telegram или номер" autocomplete="off">
            </label>
            <div class="prg-actions">
                <button type="submit" class="btn-outline">Найти</button>
                {% if holiday_q %}<a class="btn-outline" href="/cabinet/superadmin/payments?program=holiday{% if holiday_status %}&amp;status={{ holiday_status }}{% endif %}">Очистить поиск</a>{% endif %}
            </div>
        </form>
        {% endif %}
    </section>

    {% if holiday_status == 'tracks' %}
    <section class="prg-items">
        <h2>По трекам</h2>
        <div class="table-scroll pay-grid-scroll">
            <table class="prg-table pay-grid">
                <thead><tr><th>Трек</th><th>Цена</th><th>Оплатили</th><th>Сумма</th><th>Продажа</th></tr></thead>
                <tbody>
                    {% for t in holiday.tracks %}
                    <tr>
                        <td>{{ t.title }}</td>
                        <td>{{ t.price }}</td>
                        <td>{{ t.paid_count }}</td>
                        <td>{{ t.amount }}</td>
                        <td>{% if t.on_sale %}<span class="prg-badge prg-badge--done">Идёт</span>{% else %}<span class="prg-badge">Выключена</span>{% endif %}</td>
                    </tr>
                    {% else %}
                    <tr><td colspan="5">Треков пока нет – их заводят на экране «Периоды».</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </section>

    {% elif not holiday_status %}
    <section class="prg-items">
        <h2>Платежи</h2>
        {% if holiday.rows %}
        <div class="table-scroll pay-grid-scroll">
            <table class="prg-table pay-grid">
                <thead>
                    <tr><th>Ученик</th><th>Трек</th><th>Сумма</th><th>Когда</th><th>Статус</th>{% if can_mark %}<th>Действия</th>{% endif %}</tr>
                </thead>
                <tbody>
                    {% for row in holiday.rows %}
                    <tr>
                        <td>
                            <a href="/cabinet/students?program=holiday&amp;student={{ row.student.id }}">{{ display_name(row.student) }}</a>
                            {% set contacts = contacts_text(row.student) %}
                            <div class="prg-hint">#{{ row.student.id }}{% if contacts %} · {{ contacts }}{% endif %}</div>
                        </td>
                        <td>{{ row.track }}</td>
                        <td>{{ row.amount }}</td>
                        <td>{{ row.when }}{% if row.payment.prodamus_order_id %}<div class="prg-hint">Заказ {{ row.payment.prodamus_order_id }}</div>{% endif %}</td>
                        <td>
                            <span class="prg-badge{% if row.is_paid %} prg-badge--done{% endif %}">{{ row.status }}</span>
                            {% if row.payment.note %}<div class="prg-hint">{{ row.payment.note }}</div>{% endif %}
                        </td>
                        {% if can_mark %}
                        <td>
                            {% if row.is_paid %}
                            <button type="button" class="btn-outline" data-role="revert-open" data-action="refund" data-kind="holiday"
                                    data-payment="{{ row.payment.id }}" data-name="{{ display_name(row.student) }}">Возврат оформлен</button>
                            {% endif %}
                        </td>
                        {% endif %}
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        {% else %}
        <p class="prg-hint">{% if holiday_q %}По этому запросу платежей нет.{% else %}Оплат треков пока нет.{% endif %}</p>
        {% endif %}
    </section>

    {% else %}
    <section class="prg-items">
        <h2>{{ holiday_labels[holiday_status] }}</h2>
        {% if holiday_students %}
        <div class="table-scroll pay-grid-scroll">
            <table class="prg-table pay-grid">
                <thead><tr><th>Ученик</th><th>Контакты</th></tr></thead>
                <tbody>
                    {% for student in holiday_students %}
                    <tr>
                        <td><a href="/cabinet/students?program=holiday&amp;student={{ student.id }}">{{ display_name(student) }}</a></td>
                        <td>{{ contacts_text(student) or '–' }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        {% else %}
        <p class="prg-hint">В этой выборке никого нет.</p>
        {% endif %}
    </section>
    {% endif %}
    {% else %}

    <section class="prg-workspace-header" aria-label="Фильтры оплат">
    <div class="prg-monthbar">
        <a class="btn-outline prg-nav" href="/cabinet/superadmin/payments?month={{ prev_month }}{{ filter_qs }}" aria-label="Предыдущий месяц">←</a>
        <h2>{{ month_title }}</h2>
        <a class="btn-outline prg-nav" href="/cabinet/superadmin/payments?month={{ next_month }}{{ filter_qs }}" aria-label="Следующий месяц">→</a>
    </div>
    <div class="prg-actions">
        {% if not is_current %}<a class="btn-outline" href="/cabinet/superadmin/payments?month={{ current_month }}{{ filter_qs }}">Текущий месяц</a>{% endif %}
        <a class="btn-outline" href="/cabinet/superadmin/payments/export?month={{ month_value }}">Скачать Excel за месяц</a>
    </div>

    <nav class="seg" aria-label="Статус оплаты">
        {% for value, label in filter_labels.items() %}
        <a class="seg-btn{% if filters.status == value %} active{% endif %}"
           href="/cabinet/superadmin/payments?month={{ month_value }}{% if value %}&amp;status={{ value }}{% endif %}{% if filters.q %}&amp;q={{ filters.q|urlencode }}{% endif %}"
           {% if filters.status == value %}aria-current="page"{% endif %}>{{ label }} · {{ filter_counts[value] }}</a>
        {% endfor %}
    </nav>

    {# Фильтр и поиск (владелец 14.10.2026) — GET-форма как на «Проверке по
       ученику». Номер ищет ученика точно: «256», «#256». #}
    <form class="prg-workspace-row" method="get" action="/cabinet/superadmin/payments" role="search" aria-label="Поиск ученика в оплатах">
        <input type="hidden" name="month" value="{{ month_value }}">
        {% if filters.status %}<input type="hidden" name="status" value="{{ filters.status }}">{% endif %}
            <label class="prg-field prg-workspace-heading">Поиск
                <input type="search" name="q" value="{{ filters.q }}"
                       placeholder="Имя, ник в Telegram или номер" autocomplete="off">
            </label>
        <div class="prg-actions">
            <button type="submit" class="btn-outline">Найти</button>
            {% if filters.q %}<a class="btn-outline" href="/cabinet/superadmin/payments?month={{ month_value }}{% if filters.status %}&amp;status={{ filters.status }}{% endif %}">Очистить поиск</a>{% endif %}
        </div>
    </form>
    </section>

    <section class="prg-items">
        <h2>{{ filter_labels[filters.status] if filters.status else 'Все ученики с оплатами или окном' }}</h2>
        {% set shown = student_rows if student_rows is not none else rows %}
        {% if filters.q %}<p class="prg-hint">По поиску найдено {{ shown|length }} из {{ filter_counts[filters.status] }}</p>{% endif %}
        {% if student_rows %}
        <div class="table-scroll pay-grid-scroll">
            <table class="prg-table pay-grid">
                <thead><tr><th>Ученик</th><th>Тариф</th><th>Статус</th></tr></thead>
                <tbody>
                    {% for student in student_rows %}
                    <tr>
                        <td><a href="/cabinet/students?student={{ student.id }}">{{ display_name(student) }}</a></td>
                        <td>{{ tariff_text(student.tariff) }}</td>
                        <td>{{ filter_labels[filters.status] }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        {% elif rows %}
        <div class="table-scroll pay-grid-scroll">
            <table class="prg-table pay-grid">
                <thead>
                    <tr>
                        <th>Ученик</th>
                        <th>Тариф</th>
                        <th>Окно</th>
                        <th>Сумма</th>
                        <th>Оплата</th>
                        <th>Статус</th>
                        {% if can_mark %}<th>Действия</th>{% endif %}
                    </tr>
                </thead>
                <tbody>
                    {% for row in rows %}
                    {% set label = state_labels[row.state] %}
                    <tr>
                        <td>
                            <a href="/cabinet/students?student={{ row.student.id }}">{{ display_name(row.student) }}</a>
                            {% set contacts = contacts_text(row.student) %}
                            <div class="prg-hint">#{{ row.student.id }}{% if contacts %} · {{ contacts }}{% endif %}</div>
                        </td>
                        <td>{{ tariff_text(row.tariff) }}</td>
                        <td>{{ row.window_text }}</td>
                        <td>{{ rub(row.amount_kop) if row.amount_kop else '–' }}</td>
                        <td>
                            {% if row.payment %}
                            {{ row.paid_on }}
                            <div class="prg-hint">{{ row.method }}</div>
                            {% if row.payment.prodamus_order_id %}<div class="prg-hint">Заказ {{ row.payment.prodamus_order_id }}</div>{% endif %}
                            {% else %}–{% endif %}
                        </td>
                        <td>
                            {% if row.no_payment %}
                            {# Срок без строки платежа — денег в системе нет, зелёная метка «Оплачено» здесь врала бы (сентябрь 2026). #}
                            <span class="prg-badge">Без платежа</span>
                            <div class="prg-hint">Месяц закрыт сроком из карточки или списка</div>
                            {% else %}
                            <span class="prg-badge {{ label[1] }}">{{ label[0] }}</span>
                            {% if not row.payment %}<div class="prg-hint">{{ row.detail }}</div>{% endif %}
                            {% endif %}
                            {% if row.payment and row.payment.note %}<div class="prg-hint">{{ row.payment.note }}</div>{% endif %}
                            {% for problem in row.problems %}<div class="prg-hint">{{ problem }}</div>{% endfor %}
                        </td>
                        {% if can_mark %}
                        <td>
                            {% if row.state != 'paid' %}
                            <button type="button" class="btn-outline" data-role="mark-open"
                                    data-user="{{ row.student.id }}" data-name="{{ display_name(row.student) }}"
                                    data-amount="{{ rub_input(row.amount_kop) }}">Отметить оплату</button>
                            {% elif row.payment %}
                            {% if row.payment.source == 'manual' %}
                            <button type="button" class="btn-outline" data-role="revert-open" data-action="cancel"
                                    data-payment="{{ row.payment.id }}" data-name="{{ display_name(row.student) }}">Отменить отметку</button>
                            {% endif %}
                            <button type="button" class="btn-outline" data-role="revert-open" data-action="refund"
                                    data-payment="{{ row.payment.id }}" data-name="{{ display_name(row.student) }}">Возврат оформлен</button>
                            {% endif %}
                        </td>
                        {% endif %}
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        {% elif is_filtered %}
        <p class="prg-hint">{% if filters.status == 'unpaid' and not filters.q %}За этот месяц нет учеников, от которых ждём оплату.{% else %}В этой выборке никого нет.{% endif %}</p>
        {% else %}
        <p class="prg-hint">Окон оплаты пока нет. Задайте окно в карточке ученика или через «Оплата списком».</p>
        {% endif %}
    </section>

    {% if board.by_tariff %}
    <details class="prg-items">
        <summary>Сводка по тарифам</summary>
        <p class="prg-hint">У оплативших – тариф, за который заплатили, даже если оплата его сменила. У остальных – нынешний.</p>
        <div class="table-scroll pay-grid-scroll">
            <table class="prg-table pay-grid">
                <thead>
                    <tr><th>Тариф</th><th>Оплатили</th><th>Не оплатили</th><th>Должники</th><th>Ждём оплату</th><th>Без платежа</th></tr>
                </thead>
                <tbody>
                    {% for t in board.by_tariff %}
                    <tr>
                        <td>{{ tariff_text(t.tariff) }}</td>
                        <td>{{ t.paid_count }}{% if t.paid_kop %} · {{ rub(t.paid_kop) }}{% endif %}</td>
                        <td>{{ t.unpaid_count }}</td>
                        <td>{{ t.debt_count }}{% if t.debt_kop %} · {{ rub(t.debt_kop) }}{% endif %}</td>
                        <td>{{ t.waiting_count }}</td>
                        <td>{{ t.no_payment_count }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </details>
    {% endif %}

    {% if summary %}
    <details class="prg-items">
        <summary>Сводка по месяцам</summary>
        <p class="prg-hint">Долг за прошлые месяцы посчитан по сегодняшним ценам и нынешнему списку учеников.</p>
        <div class="table-scroll pay-grid-scroll">
            <table class="prg-table pay-grid">
                <thead>
                    <tr><th>Месяц</th><th>Оплатили</th><th>Не оплатили</th><th>Должники</th><th>Ждём оплату</th><th>Без платежа</th></tr>
                </thead>
                <tbody>
                    {% for m in summary %}
                    <tr>
                        <td><a href="/cabinet/superadmin/payments?month={{ m.period.strftime('%Y-%m') }}">{{ period_label(m.period)|capitalize }}</a></td>
                        <td>{{ m.paid_count }}{% if m.paid_kop %} · {{ rub(m.paid_kop) }}{% endif %}</td>
                        <td>{{ m.unpaid_count }}</td>
                        <td>{{ m.debt_count }}{% if m.debt_kop %} · {{ rub(m.debt_kop) }}{% endif %}</td>
                        <td>{{ m.waiting_count }}</td>
                        <td>{{ m.no_payment_count }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </details>
    {% endif %}

    {% endif %}

    {% if can_mark %}
    <form class="prg-form" data-role="mark-form" hidden>
        <h2 data-role="mark-title">Отметить оплату</h2>
        <p class="prg-hint">Для перевода на расчётный счёт школы. Ученик и служба заботы получат уведомление, как при оплате через Продамус.</p>
        <input type="hidden" name="user_id">
        <label class="prg-field">За месяц
            <input type="month" name="month" value="{{ month_value }}" required>
        </label>
        <label class="prg-field">Сумма, ₽
            <input type="text" name="amount" inputmode="decimal" required>
        </label>
        <label class="prg-field">Деньги пришли
            <input type="date" name="paid_on" value="{{ today }}" required>
        </label>
        <label class="prg-field">Комментарий
            <input type="text" name="comment" maxlength="300" placeholder="Номер платёжки, от кого перевод">
        </label>
        <p class="prg-hint" data-role="mark-error" role="alert" hidden></p>
        <div class="prg-form-actions">
            <button type="button" class="btn-outline" data-role="mark-cancel">Отмена</button>
            <button type="submit" class="btn-blue">Отметить</button>
        </div>
    </form>

    <div class="card" data-role="revert-confirm" hidden>
        <p class="prg-hint" data-role="revert-text"></p>
        <p class="prg-hint" data-role="revert-error" role="alert" hidden></p>
        <div class="modal-actions">
            <button type="button" class="btn-outline" data-role="revert-cancel">Отмена</button>
            <button type="button" class="btn-blue" data-role="revert-send">Подтвердить</button>
        </div>
    </div>
    {% endif %}

    {% if not holiday and board.no_window %}
    <section class="prg-items">
        <h2>Без окна оплаты</h2>
        <p class="prg-hint">Им оплату не ждём, и кабинет по неоплате не закроется. Окно ставится в карточке ученика или загрузкой «Оплата списком».</p>
        <p class="prg-hint">
            {% for student in board.no_window %}<a href="/cabinet/students?student={{ student.id }}">{{ display_name(student) }}</a>{% if not loop.last %}, {% endif %}{% endfor %}
        </p>
    </section>
    {% endif %}

    {# Ушли с курса (владелец 16.10.2026): месяц не оплачен, срок доступа
       наступил. Не должники — `payment_board.has_left`. #}
    {% if not holiday and board.left %}
    <section class="prg-items">
        <h2>Ушли с курса</h2>
        <p class="prg-hint">Срок доступа у них наступил: оплату не ждём, в должниках не считаем. Если ученик вернулся, уберите срок в карточке, и он снова появится в таблице.</p>
        <p class="prg-hint">
            {% for student in board.left %}<a href="/cabinet/students?student={{ student.id }}">{{ display_name(student) }}</a> (доступ до {{ msk_date_text(student.access_until) }}){% if not loop.last %}, {% endif %}{% endfor %}
        </p>
    </section>
    {% endif %}
</div>

{% if can_mark %}
<script>
(function () {
    const form = document.querySelector('[data-role="mark-form"]');
    const markTitle = form.querySelector('[data-role="mark-title"]');
    const markError = form.querySelector('[data-role="mark-error"]');
    const confirmBox = document.querySelector('[data-role="revert-confirm"]');
    const revertText = confirmBox.querySelector('[data-role="revert-text"]');
    const revertError = confirmBox.querySelector('[data-role="revert-error"]');
    const revertSend = confirmBox.querySelector('[data-role="revert-send"]');
    let revert = null;

    function failure(resp, body) {
        const reason = window.csrfMessage(body, '');
        return typeof reason === 'string' && reason ? reason : 'Не получилось. Попробуйте ещё раз.';
    }

    function send(url, body) {
        return window.csrfFetch(url, { method: 'POST', body: body }).then(function (resp) {
            return resp.json().catch(function () { return {}; }).then(function (data) {
                if (!resp.ok || !data.ok) throw new Error(failure(resp, data));
                return data;
            });
        });
    }

    document.querySelectorAll('[data-role="mark-open"]').forEach(function (btn) {
        btn.addEventListener('click', function () {
            confirmBox.hidden = true;
            form.user_id.value = btn.dataset.user;
            form.amount.value = btn.dataset.amount || '';
            form.comment.value = '';
            markTitle.textContent = 'Отметить оплату: ' + btn.dataset.name;
            markError.hidden = true;
            form.hidden = false;
            form.scrollIntoView({ block: 'center' });
            form.amount.focus();
        });
    });
    form.querySelector('[data-role="mark-cancel"]').addEventListener('click', function () { form.hidden = true; });
    form.addEventListener('submit', function (event) {
        event.preventDefault();
        const submit = form.querySelector('[type="submit"]');
        submit.disabled = true;
        markError.hidden = true;
        send('/cabinet/superadmin/payments/mark', new FormData(form))
            .then(function () { window.location.reload(); })
            .catch(function (err) {
                markError.textContent = err.message;
                markError.hidden = false;
                submit.disabled = false;
            });
    });

    document.querySelectorAll('[data-role="revert-open"]').forEach(function (btn) {
        btn.addEventListener('click', function () {
            form.hidden = true;
            revert = btn.dataset;
            revertText.textContent = revert.action !== 'refund'
                ? 'Отменить ручную отметку оплаты? Ученик: ' + revert.name + '. Срок оплаты вернётся к тому, что был до отметки.'
                : revert.kind === 'holiday'
                    ? 'Оформить возврат? Ученик: ' + revert.name + '. Трек с ученика снимется. Сами деньги возвращают в кабинете Продамуса – здесь только отметка.'
                    : 'Оформить возврат? Ученик: ' + revert.name + '. Месяц снова станет неоплаченным. Сами деньги возвращают в кабинете Продамуса или переводом – здесь только отметка.';
            revertError.hidden = true;
            confirmBox.hidden = false;
            confirmBox.scrollIntoView({ block: 'center' });
        });
    });
    confirmBox.querySelector('[data-role="revert-cancel"]').addEventListener('click', function () { confirmBox.hidden = true; });
    revertSend.addEventListener('click', function () {
        if (!revert) return;
        revertSend.disabled = true;
        send('/cabinet/superadmin/payments/' + revert.payment + '/' + revert.action, new FormData())
            .then(function () { window.location.reload(); })
            .catch(function (err) {
                revertError.textContent = err.message;
                revertError.hidden = false;
                revertSend.disabled = false;
            });
    });
})();
</script>
{% endif %}
{% endblock %}
