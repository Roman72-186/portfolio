{% extends "base.html" %}
{#
Входной список экрана «Оценка точки А» (Лиза 14.09.2026): ники подряд,
разобранные гаснут и уезжают вниз, но остаются видимыми — «чтобы я могла
листать и видеть, кого я уже проверила, а кого ещё не проверила».

Без своего <style> — только prg-* (program.css), как в
прежний экран «Проверка по ученику»: новый блок стилей запрещает
tests/test_reuse_ratchet.py. Приглушение разобранной строки — общий класс
`.prg-item.is-done` в program.css.
#}
{% block title %}Оценка точки А{% endblock %}
{% block extra_styles %}
<link rel="stylesheet" href="/static/css/program.css?v=76">
{% endblock %}
{% block content %}
<div class="prg-page prg-page--point-a">
    <div class="prg-head">
        <div class="prg-head-copy">
            <h1>Оценка точки А</h1>
            <p>Откройте карточку ученика, чтобы оценить пробники, контрольные и портфолио. Итоговый уровень появится после оценки всех блоков.</p>
        </div>
    </div>

    <p><a class="btn-outline" href="/cabinet/staff/point-a-audio">🎙 Голосовые по уровням</a></p>

    {% include "partials/program_switch.html" %}
    <form class="prg-form" method="get" action="/cabinet/staff/point-a">
        <input type="hidden" name="cohort" value="{{ cohort }}">
        <label class="prg-field">Сортировка
            <select name="sort">
                <option value="pending"{% if sort == "pending" %} selected{% endif %}>Сначала без полной оценки</option>
                <option value="name"{% if sort == "name" %} selected{% endif %}>По фамилии и имени</option>
            </select>
        </label>
        <div class="prg-actions prg-form-actions">
            <button type="submit" class="btn-blue">Применить сортировку</button>
        </div>
    </form>

    <section class="prg-items">
        {% if rows %}
        {% for row in rows %}
        {% set pa = row.point_a %}
        <a class="prg-item{{ ' is-done' if pa.is_done }}" href="/cabinet/staff/point-a/{{ pa.student.id }}{{ point_a_query }}">
            <div>
                <h3>{{ '✓ ' if pa.is_done }}{{ pa.student.name }}</h3>
                <div class="prg-meta">
                    {% if pa.student.tariff %}<span>{{ pa.student.tariff }}</span>{% endif %}
                    {% if pa.plates %}
                    <span>оценено {{ pa.scored_count }} из {{ pa.plates|length }}</span>
                    {% else %}
                    <span>работ пока нет</span>
                    {% endif %}
                </div>
            </div>
            <div class="prg-item-actions">
                {% if pa.average is not none %}
                <span class="prg-badge{{ ' prg-badge--done' if pa.is_done }}">средний балл {{ pa.average }}</span>
                {% else %}
                <span class="prg-badge">не оценён</span>
                {% endif %}
            </div>
        </a>
        {% endfor %}
        {% else %}
        <div class="prg-empty">Учеников пока нет.</div>
        {% endif %}
    </section>
</div>
{% endblock %}
