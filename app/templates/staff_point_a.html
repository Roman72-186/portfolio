{% extends "base.html" %}
{#
Входной список экрана «Оценка точки А» (Лиза 14.09.2026): ники подряд,
разобранные гаснут и уезжают вниз, но остаются видимыми — «чтобы я могла
листать и видеть, кого я уже проверила, а кого ещё не проверила».

Без своего <style> — только prg-* (program.css), как в
staff_students_review.html: новый блок стилей запрещает
tests/test_reuse_ratchet.py. Приглушение разобранной строки — общий класс
`.prg-item.is-done` в program.css.
#}
{% block title %}Оценка точки А{% endblock %}
{% block extra_styles %}
<link rel="stylesheet" href="/static/css/program.css?v=25">
{% endblock %}
{% block content %}
<div class="prg-page prg-page--point-a">
    <div class="prg-head">
        <div class="prg-head-copy">
            <h1>Оценка точки А</h1>
            <p>Откройте ученика — увидите пробники, контрольные и оба портфолио сразу. Средний балл посчитается сам, когда все блоки получат оценку.</p>
        </div>
    </div>

    <section class="prg-items">
        {% if rows %}
        {% for row in rows %}
        {% set pa = row.point_a %}
        <a class="prg-item{{ ' is-done' if pa.is_done }}" href="/cabinet/staff/point-a/{{ pa.student.id }}">
            <div>
                <h3>{{ '✓ ' if pa.is_done }}{{ pa.student.name }}</h3>
                <div class="prg-meta">
                    {% if pa.student.tariff %}<span>{{ pa.student.tariff }}</span>{% endif %}
                    {% if pa.plates %}
                    <span>оценено {{ pa.scored_count }} из {{ pa.plates|length }}</span>
                    {% else %}
                    <span>работ пока нет</span>
                    {% endif %}
                </div>
            </div>
            <div class="prg-item-actions">
                {% if pa.average is not none %}
                <span class="prg-badge{{ ' prg-badge--done' if pa.is_done }}">средний балл {{ pa.average }}</span>
                {% else %}
                <span class="prg-badge">не оценён</span>
                {% endif %}
            </div>
        </a>
        {% endfor %}
        {% else %}
        <div class="prg-empty">Учеников пока нет.</div>
        {% endif %}
    </section>
</div>
{% endblock %}
