{% extends "base.html" %}
{% block title %}Портфолио учеников{% endblock %}
{% block extra_styles %}
<style>
/* Override base .main for full-width split layout */
.main {
    max-width: 100% !important;
    padding: 0 !important;
}

/* ── Split layout ── */
.split-wrap {
    display: flex;
    height: calc(100vh - 57px);
    overflow: hidden;
}

/* ── Sidebar ── */
.sidebar {
    width: 280px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--line);
    background: var(--surface);
}
.sidebar-header {
    padding: 16px 16px 12px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
}
.sidebar-back {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--muted); font-weight: 500;
    margin-bottom: 12px; opacity: 1;
}
.sidebar-back:hover { color: var(--blue); opacity: 1; }
.sidebar-title {
    font-size: 15px; font-weight: 700; color: var(--text);
    margin-bottom: 10px;
}
.sidebar-search {
    width: 100%; padding: 8px 12px;
    background: var(--bg); border: 1.5px solid var(--line);
    border-radius: var(--r-sm); font-size: 13px; color: var(--text);
    font-family: inherit; outline: none;
    transition: border-color 0.2s;
}
.sidebar-search:focus { border-color: var(--blue); }

.sidebar-list {
    flex: 1; overflow-y: auto;
    padding: 8px 0;
}
.sidebar-list::-webkit-scrollbar { width: 4px; }
.sidebar-list::-webkit-scrollbar-track { background: transparent; }
.sidebar-list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

.student-row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; cursor: pointer;
    transition: background 0.15s;
    border-radius: 0; width: 100%; background: none; border: none; text-align: left; font-family: inherit;
}
.student-row:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
.student-row:hover { background: var(--bg); }
.student-row.active { background: var(--blue-soft); }
.student-row.active .student-row-name { color: var(--blue); font-weight: 700; }
.student-avatar {
    width: 38px; height: 38px; border-radius: 50%;
    object-fit: cover; border: 1px solid var(--line);
    flex-shrink: 0;
}
.student-avatar-ph {
    width: 38px; height: 38px; border-radius: 50%;
    background: var(--surface-2); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
}
.student-row-info { flex: 1; min-width: 0; }
.student-row-name {
    font-size: 13px; font-weight: 700; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.student-row-meta { font-size: 11px; color: var(--dim); margin-top: 1px; }

/* ── Main panel ── */
.split-main {
    flex: 1;
    display: flex; flex-direction: column;
    overflow: hidden;
    background: var(--bg);
}
.split-main-scroll {
    flex: 1; overflow-y: auto;
    padding: 20px 24px;
}
.split-main-scroll::-webkit-scrollbar { width: 6px; }
.split-main-scroll::-webkit-scrollbar-track { background: transparent; }
.split-main-scroll::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

/* Student hero in main panel */
.student-hero {
    background: linear-gradient(135deg, var(--blue-deep) 0%, var(--blue-mid) 100%);
    border-radius: var(--r-lg);
    padding: 20px 24px;
    display: flex; align-items: center; gap: 18px;
    margin-bottom: 20px;
    box-shadow: var(--sh-blue);
    position: relative; overflow: hidden;
}
.student-hero::before {
    content: ''; position: absolute;
    width: 200px; height: 200px; border-radius: 50%;
    background: rgba(255,255,255,0.04);
    top: -60px; right: -40px; pointer-events: none;
}
.student-hero-avatar {
    width: 56px; height: 56px; border-radius: 50%;
    object-fit: cover; border: 2px solid rgba(255,255,255,0.25);
    flex-shrink: 0; position: relative; z-index: 1;
}
.student-hero-avatar-ph {
    width: 56px; height: 56px; border-radius: 50%;
    background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.2);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0; position: relative; z-index: 1;
}
.student-hero-info { flex: 1; position: relative; z-index: 1; }
.student-hero-name { font-size: 20px; font-weight: 900; color: #fff; margin-bottom: 6px; }
.student-hero-pills { display: flex; gap: 8px; flex-wrap: wrap; }
.student-hero-pill {
    background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.18);
    border-radius: var(--r-md); padding: 3px 12px;
    font-size: 12px; color: rgba(255,255,255,0.85); font-weight: 700;
}
.student-hero-score {
    position: relative; z-index: 1; text-align: right; flex-shrink: 0;
}
.score-big { font-size: 34px; font-weight: 900; color: #FCD34D; line-height: 1; }
.score-label { font-size: 11px; color: rgba(255,255,255,0.6); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }

/* Period tabs */
.period-tabs {
    display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px;
}
.period-tab {
    padding: 7px 16px; border-radius: var(--r-xl);
    font-size: 13px; font-weight: 700; cursor: pointer;
    border: 1.5px solid var(--line); background: var(--surface);
    color: var(--muted); transition: border-color 0.2s, color 0.2s, background 0.2s;
}
.period-tab:hover { border-color: rgba(59,91,255,0.30); color: var(--blue); }
.period-tab.active {
    background: var(--blue); color: #fff; border-color: var(--blue);
}

/* Section label */
.section-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--dim); margin-bottom: 10px;
}

/* Photo grid */
.photo-grid-cur {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 8px;
    margin-bottom: 20px;
}
.photo-grid-cur img {
    width: 100%; aspect-ratio: 1; object-fit: cover;
    border-radius: var(--r-sm); border: 1px solid var(--line);
    cursor: zoom-in; transition: transform 0.2s, box-shadow 0.2s;
}
.photo-grid-cur img:hover { transform: scale(1.03); box-shadow: var(--sh-md); }

/* Empty/loading states */
.empty-state {
    text-align: center; padding: 48px 20px; color: var(--dim);
}
.empty-icon { font-size: 40px; margin-bottom: 12px; }
.empty-text { font-size: 14px; }

.loading-state {
    text-align: center; padding: 48px 20px; color: var(--dim);
}

/* Lightbox */
.lb {
    position: fixed; inset: 0; background: rgba(10,10,30,0.88);
    z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px;
}
.lb.open { display: flex; }
.lb img { max-width: 100%; max-height: 88vh; border-radius: var(--r-md); box-shadow: 0 24px 80px rgba(0,0,0,0.5); }
.lb-close {
    position: absolute; top: 16px; right: 16px;
    background: rgba(255,255,255,0.15); border: none; color: #fff;
    width: 44px; height: 44px; border-radius: 50%; font-size: 22px; cursor: pointer;
    transition: background 0.2s;
}
.lb-close:hover { background: rgba(255,255,255,0.28); }
.lb-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(255,255,255,0.12); border: none; color: #fff;
    width: 44px; height: 44px; border-radius: 50%; font-size: 22px; cursor: pointer;
    transition: background 0.2s;
}
.lb-nav:hover { background: rgba(255,255,255,0.25); }
.lb-prev { left: 16px; }
.lb-next { right: 70px; }

/* "До" section */
.do-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 12px; border-radius: var(--r-xl);
    background: rgba(220,38,38,0.08); color: var(--error);
    font-size: 12px; font-weight: 700; margin-bottom: 10px;
}
.after-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 12px; border-radius: var(--r-xl);
    background: rgba(5,150,105,0.08); color: var(--ok);
    font-size: 12px; font-weight: 700; margin-bottom: 10px;
}

/* Mobile: sidebar collapses */
@media (max-width: 768px) {
    .split-wrap { flex-direction: column; height: auto; overflow: visible; }
    .sidebar { width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--line); }
    .sidebar-list { max-height: 200px; }
    .split-main { overflow: visible; }
    .split-main-scroll { overflow: visible; padding: 16px; }
}
</style>
{% endblock %}
{% block content %}
<script>const CSRF_TOKEN = "{{ csrf_token(request) }}";</script>
<div class="split-wrap">

    <!-- ── Sidebar ── -->
    <div class="sidebar">
        <div class="sidebar-header">
            <a href="/cabinet/curator" class="sidebar-back">← Кабинет</a>
            <div class="sidebar-title">Портфолио</div>
            <input type="text" class="sidebar-search" placeholder="Поиск ученика…"
                   oninput="filterStudents(this.value)" id="student-search">
        </div>
        <div class="sidebar-list" id="student-list">
            {% for s in sidebar_students %}
            <button type="button" class="student-row" id="srow-{{ s.id }}" onclick="selectStudent({{ s.id }})" aria-label="{{ s.name }}">
                {% if s.photo_url %}
                <img src="{{ s.photo_url }}" class="student-avatar" alt="">
                {% else %}
                <div class="student-avatar-ph"><svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v2"/></svg></div>
                {% endif %}
                <div class="student-row-info">
                    <div class="student-row-name">{{ s.name }}</div>
                    <div class="student-row-meta">
                        {{ s.tariff or '—' }}
                        {% if s.avg_score is not none %} · {{ s.avg_score }} ср.{% endif %}
                    </div>
                </div>
            </button>
            {% endfor %}
        </div>
    </div>

    <!-- ── Main panel ── -->
    <div class="split-main">
        <div class="split-main-scroll" id="main-panel">
            <div class="empty-state" id="select-prompt">
                <div class="empty-icon"><svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></div>
                <div class="empty-text">Выберите ученика слева</div>
            </div>
        </div>
    </div>

</div>

{% include "partials/lightbox.html" %}

<script>
var INITIAL_STUDENT_ID = {{ initial_student_id }};
var _allPhotos = [];
var _lbIdx = 0;
var _currentData = null;
var _currentPeriod = null;

// ── Student selection ────────────────────────────────────────────────────────

function selectStudent(id) {
    document.querySelectorAll('.student-row').forEach(r => r.classList.remove('active'));
    var row = document.getElementById('srow-' + id);
    if (row) row.classList.add('active');

    document.getElementById('main-panel').innerHTML = '<div class="loading-state">Загружаем…</div>';

    fetch('/cabinet/curator/portfolio/student/' + id)
        .then(r => r.json())
        .then(data => {
            _currentData = data;
            renderPortfolio(data);
        })
        .catch(() => {
            document.getElementById('main-panel').innerHTML =
                '<div class="empty-state"><div class="empty-icon"><svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div><div class="empty-text">Ошибка загрузки</div></div>';
        });
}

// ── Render ───────────────────────────────────────────────────────────────────

function renderPortfolio(data) {
    var s = data.student;
    var html = '';

    // Hero
    var avatar = s.photo_url
        ? '<img src="' + esc(s.photo_url) + '" class="student-hero-avatar" alt="">'
        : '<div class="student-hero-avatar-ph"><svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v2"/></svg></div>';
    var scoreHtml = s.avg_score != null
        ? '<div class="student-hero-score"><div class="score-big">' + s.avg_score + '</div><div class="score-label">ср. балл</div></div>'
        : '';
    html += '<div class="student-hero">'
        + avatar
        + '<div class="student-hero-info">'
        +   '<div class="student-hero-name">' + esc(s.name) + '</div>'
        +   '<div class="student-hero-pills">'
        +     (s.tariff ? '<span class="student-hero-pill">' + esc(s.tariff) + '</span>' : '')
        +     (s.study_duration ? '<span class="student-hero-pill">' + esc(s.study_duration) + '</span>' : '')
        +   '</div>'
        + '</div>'
        + scoreHtml
        + '</div>';

    // Tabs: "ДО" + each month
    html += '<div class="period-tabs" id="period-tabs">';
    html += '<button class="period-tab" id="tab-do" onclick="showPeriod(\'do\', this)">ДО</button>';
    if (data.after_by_month && data.after_by_month.length) {
        data.after_by_month.forEach(function(g) {
            var key = g.year + '-' + g.month;
            html += '<button class="period-tab" id="tab-' + key + '" onclick="showPeriod(\'' + key + '\', this)">'
                + esc(g.month) + ' ' + g.year + ' (' + g.total + ')</button>';
        });
    }
    html += '</div>';

    // Content area
    html += '<div id="period-content"></div>';

    document.getElementById('main-panel').innerHTML = html;

    // Auto-show first tab
    if (data.before_works && data.before_works.length) {
        showPeriod('do', document.getElementById('tab-do'));
    } else if (data.after_by_month && data.after_by_month.length) {
        var firstKey = data.after_by_month[0].year + '-' + data.after_by_month[0].month;
        showPeriod(firstKey, document.getElementById('tab-' + firstKey));
    } else {
        document.getElementById('period-content').innerHTML =
            '<div class="empty-state"><div class="empty-icon"><svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></div><div class="empty-text">Нет загруженных работ</div></div>';
    }
}

function showPeriod(key, btn) {
    _currentPeriod = key;
    document.querySelectorAll('.period-tab').forEach(t => t.classList.remove('active'));
    if (btn) btn.classList.add('active');

    var data = _currentData;
    var content = '';

    if (key === 'do') {
        var works = data.before_works || [];
        if (works.length) {
            content += '<div class="do-badge"><svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> ДО обучения — ' + works.length + ' фото</div>';
            content += buildPhotoGrid(works);
        } else {
            content = '<div class="empty-state"><div class="empty-icon"><svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></div><div class="empty-text">Нет работ «До»</div></div>';
        }
    } else {
        var group = (data.after_by_month || []).find(function(g) {
            return (g.year + '-' + g.month) === key;
        });
        if (group && group.works.length) {
            content += '<div class="after-badge"><svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg> ПОСЛЕ — ' + esc(group.month) + ' ' + group.year + '</div>';
            content += buildPhotoGrid(group.works);
        } else {
            content = '<div class="empty-state"><div class="empty-icon"><svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></div><div class="empty-text">Нет работ</div></div>';
        }
    }

    document.getElementById('period-content').innerHTML = content;
}

function buildPhotoGrid(works) {
    if (!works.length) return '';
    var html = '<div class="photo-grid-cur" data-gallery="cur-period">';
    works.forEach(function(w) {
        if (w.s3_url) {
            html += '<img class="photo-thumb" src="' + esc(w.s3_url) + '" alt="' + esc(w.filename) + '" loading="lazy" onclick="openGallery(this)">';
        }
    });
    html += '</div>';
    return html;
}

// ── Sidebar search ───────────────────────────────────────────────────────────

function filterStudents(q) {
    q = q.toLowerCase();
    document.querySelectorAll('.student-row').forEach(function(row) {
        var name = row.querySelector('.student-row-name').textContent.toLowerCase();
        row.style.display = name.includes(q) ? '' : 'none';
    });
}

// ── Escape helper ────────────────────────────────────────────────────────────
function esc(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Auto-select on load ──────────────────────────────────────────────────────
if (INITIAL_STUDENT_ID) {
    selectStudent(INITIAL_STUDENT_ID);
}
</script>
{% endblock %}
