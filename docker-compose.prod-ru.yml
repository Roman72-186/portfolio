# Для российского сервера: включает собственный Traefik, не зависит от n8n_default.
# Деплой: PORTFOLIO_COMPOSE_FILE=docker-compose.prod-ru.yml python scripts/deploy.py

services:
  traefik:
    image: dockerhub.timeweb.cloud/library/traefik:v2.11
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.forwardedHeaders.trustedIPs=103.134.155.0/24,160.25.253.0/24,160.79.120.0/24,185.121.240.0/22,188.0.150.0/24,193.104.120.0/24,193.84.78.0/24,193.84.90.0/24"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.forwardedHeaders.trustedIPs=103.134.155.0/24,160.25.253.0/24,160.79.120.0/24,185.121.240.0/22,188.0.150.0/24,193.104.120.0/24,193.84.78.0/24,193.84.90.0/24"
      # A 10-photo intermediate submission is one multipart request (up to
      # ~100 MB). Keep the proxy open while a slow client uploads and while
      # the app compresses/uploads the batch to S3; otherwise Traefik returns
      # a 504 that the browser can misreport as an expired session.
      - "--entrypoints.websecure.transport.respondingTimeouts.readTimeout=900s"
      - "--entrypoints.websecure.transport.respondingTimeouts.writeTimeout=900s"
      - "--entrypoints.websecure.transport.respondingTimeouts.idleTimeout=900s"
      - "--entrypoints.web.transport.respondingTimeouts.readTimeout=900s"
      - "--certificatesresolvers.mytlschallenge.acme.tlschallenge=true"
      - "--certificatesresolvers.mytlschallenge.acme.email=${SSL_EMAIL}"
      - "--certificatesresolvers.mytlschallenge.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - traefik_certs:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - web
    restart: unless-stopped

  app:
    build: .
    expose:
      - "8000"
    env_file: .env
    volumes:
      - ./app:/app/app
      # Контент 3D-лаборатории: 4.8 ГБ вне git, только на чтение.
      - ./lab-assets:/app/lab-assets:ro
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      # Основной роутер: apparchi.ru
      - traefik.http.routers.portfolio-apparchi.rule=Host(`apparchi.ru`) || Host(`www.apparchi.ru`)
      - traefik.http.routers.portfolio-apparchi.tls=true
      - traefik.http.routers.portfolio-apparchi.entrypoints=websecure
      - traefik.http.routers.portfolio-apparchi.tls.certresolver=mytlschallenge
      - traefik.http.routers.portfolio-apparchi.service=portfolio
      - traefik.http.routers.portfolio-apparchi.middlewares=sec-headers@docker
      - traefik.http.services.portfolio.loadbalancer.server.port=8000
      - "traefik.http.middlewares.sec-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.sec-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.sec-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.sec-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.sec-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.sec-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.sec-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.sec-headers.headers.permissionsPolicy=geolocation=(), microphone=(), camera=()"
      - "traefik.http.middlewares.sec-headers.headers.contentSecurityPolicy=default-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' https://telegram.org https://assets.mediadelivery.net https://cdn.jsdelivr.net; worker-src 'self'; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' blob: https:; frame-src https://iframe.mediadelivery.net; frame-ancestors 'none'"
      - "traefik.http.middlewares.sec-headers.headers.customResponseHeaders.Server="
      - "traefik.http.middlewares.sec-headers.headers.customResponseHeaders.X-Powered-By="
    networks:
      - web
      - default
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 --timeout-keep-alive 75 --limit-concurrency 200 --limit-max-requests 5000"
    deploy:
      resources:
        limits:
          memory: 1400M
        reservations:
          memory: 400M
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: dockerhub.timeweb.cloud/library/redis:7-alpine
    env_file: .env
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
        redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 64mb --maxmemory-policy allkeys-lru;
      else
        redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru;
      fi'
    networks:
      - default
    restart: unless-stopped

  db:
    image: dockerhub.timeweb.cloud/library/postgres:15-alpine
    env_file: .env
    volumes:
      - portfolio_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - default
    restart: unless-stopped

volumes:
  portfolio_postgres:
  traefik_certs:

networks:
  web:
    name: web
  default: {}
